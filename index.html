<html>
<head>
  <title>Glastocam</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .image-container {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 100%;
    }
    .image-box {
      border: 3px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f5f5f5;
    }
    #camimage {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .title {
      text-align: center;
      color: #333;
      margin: 0 0 12px 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
  </style>
  <script>
    function reloadImage() {
      const img = document.getElementById("camimage");
      img.src = "https://panodata.panomax.com/cams/879/recent_full.jpg?ts=" + new Date().getTime();
    }
    window.onload = function () {
      reloadImage();
      document.getElementById("camimage").onload = function () {
        const scrollX = (document.body.scrollWidth - window.innerWidth) / 4;
        const scrollY = document.body.scrollHeight;
        window.scrollTo(scrollX, scrollY);
      };
      setInterval(reloadImage, 300000);
    };
  </script>
</head>
<body>
  <div class="image-container">
    <h1 class="title">Glastocam</h1>
    <div class="image-box">
      <img id="camimage" src="" alt="Webcam image">
    </div>
  </div>
</body>
</html>
