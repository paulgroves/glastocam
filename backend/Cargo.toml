[package]
name = "glastocam-api"
version = "0.1.0"
edition = "2021"
description = "Backend API for Glastocam - Glastonbury webcam viewer"
authors = ["Glastocam Team"]

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"

